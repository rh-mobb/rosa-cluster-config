#################################################################
# Infrastructure Configuration for cz-demo (ROSA HCP public recipe)
#
# OCP 5.x: use cluster-logging stable-6.5+ and EFS CSI from the stable
# channel (no stale startingCSV pin). IRSA + EFS from platform metadata.
#################################################################

#################################################################
# teamName used for argocd application names and namespace names.
#################################################################
teamName: cluster-config

#################################################################
# Default Values for app-of-apps-infrastructure helm chart
#################################################################
defaults:
  clusterName: cz-demo

  finalizers: resources-finalizer.argocd.argoproj.io
  gitopsNamespace: openshift-gitops

  helmRepoUrl: https://rh-mobb.github.io/validated-pattern-helm-charts/
  path: charts

  plugin: false
  AWS_REGION: "ap-southeast-2"

#################################################################
# INFRASTRUCTURE Charts to be deployed.
#################################################################
infrastructure:
  # ESO IRSA from bootstrap ConfigMap rosa-platform-metadata (enable_secrets_manager_iam on cluster).
  # Doc: validated-pattern-terraform-rosa docs/architecture/platform-metadata-irsa.md
  - chart: external-secrets-operator
    targetRevision: 1.1.7
    namespace: external-secrets-operator
    values:
      platformMetadata:
        enabled: true
      secretStore:
        name: aws-secrets-manager
      target:
        enabled: false
      helper-status-checker:
        enabled: true

  # EFS CSI — roleArn + fileSystemId from bootstrap ConfigMap rosa-platform-metadata
  - chart: cluster-efs
    targetRevision: 0.5.1
    namespace: openshift-cluster-csi-drivers
    values:
      platformMetadata:
        enabled: true

  - chart: web-terminal-operator
    targetRevision: 1.0.0
    namespace: openshift-operators
    values:

  - chart: compliance-operator
    targetRevision: 1.2.12
    namespace: openshift-compliance
    values:
      helper-operator:
        startingCSV: compliance-operator.v1.10.1

  - chart: overprovisioning
    targetRevision: 0.0.7
    namespace: overprovisioning
    values:

  # Cluster Logging — stable-6.5+ for OCP 5.x (stable-6.4 not in catalog)
  - chart: cluster-logging
    targetRevision: 0.5.18
    namespace: openshift-logging
    values:
      platformMetadata:
        enabled: true
      helper-operator:
        operators:
          cluster-logging:
            subscription:
              channel: stable-6.5
        startingCSV: cluster-logging.v6.5.4