teamName: cluster-config

defaults:
  clusterName: rhai
  finalizers: resources-finalizer.argocd.argoproj.io
  gitopsNamespace: openshift-gitops
  helmRepoUrl: https://rh-mobb.github.io/validated-pattern-helm-charts/
  path: charts
  plugin: false
  AWS_REGION: "ap-southeast-2"
  AVP_TYPE: "awssecretsmanager"

infrastructure:
  - chart: rhai-on-openshift-chart
    gitRepoUrl: https://github.com/opendatahub-io/odh-gitops.git
    targetRevision: main
    path: charts/rhai-on-openshift-chart
    namespace: redhat-ods-operator
    values:
      skipCrdCheck: true
      operator:
        type: rhoai
        enabled: true
      profile: rhaii
      components:
        dashboard:
          dsc:
            managementState: Managed
        workbenches:
          dsc:
            managementState: Managed
        aipipelines:
          dsc:
            managementState: Managed
        kserve:
          dsc:
            managementState: Managed
          gateway:
            spec:
              listeners:
                - name: https
                  port: 443
                  protocol: HTTPS
                  allowedRoutes:
                    namespaces:
                      from: Selector
        kueue:
          dsc:
            managementState: Unmanaged
        ray:
          dsc:
            managementState: Managed
        modelregistry:
          dsc:
            managementState: Managed
        trustyai:
          dsc:
            managementState: Managed
        trainingoperator:
          dsc:
            managementState: Managed
        trainer:
          dsc:
            managementState: Managed
        feastoperator:
          dsc:
            managementState: Managed
        aigateway:
          dsc:
            managementState: Managed
        ogx:
          dsc:
            managementState: Managed
        mlflowoperator:
          dsc:
            managementState: Managed
