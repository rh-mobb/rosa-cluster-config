teamName: cluster-config

defaults:
  clusterName: rhai
  finalizers: resources-finalizer.argocd.argoproj.io
  gitopsNamespace: openshift-gitops
  helmRepoUrl: https://rh-mobb.github.io/validated-pattern-helm-charts/
  path: charts
  plugin: false
  AWS_REGION: "ap-southeast-2"
  AVP_TYPE: "awssecretsmanager"

infrastructure:
  - chart: rhai-on-openshift-chart
    gitRepoUrl: https://github.com/opendatahub-io/odh-gitops.git
    targetRevision: main
    path: charts/rhai-on-openshift-chart
    namespace: redhat-ods-operator
    values:
      skipCrdCheck: true
      operator:
        type: rhoai
        enabled: true
      profile: rhaii
      components:
        dashboard:
          dsc:
            managementState: Managed
        workbenches:
          dsc:
            managementState: Managed
        aipipelines:
          dsc:
            managementState: Managed
        kserve:
          dsc:
            managementState: Managed
            nim:
              managementState: Managed
          gateway:
            spec:
              listeners:
                - name: https
                  port: 443
                  protocol: HTTPS
                  allowedRoutes:
                    namespaces:
                      from: Selector
        kueue:
          dsc:
            managementState: Unmanaged
        ray:
          dsc:
            managementState: Managed
        modelregistry:
          dsc:
            managementState: Managed
        trustyai:
          dsc:
            managementState: Managed
        trainingoperator:
          dsc:
            managementState: Managed
        trainer:
          dsc:
            managementState: Managed
        feastoperator:
          dsc:
            managementState: Managed
        aigateway:
          dsc:
            managementState: Managed
            modelsAsAService:
              managementState: Managed
          modelsAsAService:
            gateway:
              openshiftRoute:
                enabled: true
                host: maas.apps.rosa.rhai.dfom.p3.openshiftapps.com
              spec:
                listeners:
                  - name: https
                    hostname: maas.apps.rosa.rhai.dfom.p3.openshiftapps.com
                    port: 443
                    protocol: HTTPS
                    allowedRoutes:
                      namespaces:
                        from: Selector
        ogx:
          dsc:
            managementState: Managed
        mlflowoperator:
          dsc:
            managementState: Managed
      dependencies:
        nfd:
          config:
            spec:
              operand:
                imagePullPolicy: IfNotPresent
                servicePort: 12000
              workerConfig:
                configData: |
                  core:
                    sleepInterval: 60s
                  sources:
                    pci:
                      deviceClassWhitelist:
                        - "0200"
                        - "03"
                        - "12"
                      deviceLabelFields:
                        - "vendor"
        rhcl:
          config:
            tlsEnabled: true
        nvidiaGPUOperator:
          config:
            spec:
              operator:
                defaultRuntime: crio
                use_ocp_driver_toolkit: true
              daemonsets:
                updateStrategy: RollingUpdate
                rollingUpdate:
                  maxUnavailable: "1"
              driver:
                enabled: true
              toolkit:
                enabled: true
              devicePlugin:
                enabled: true
              dcgm:
                enabled: true
              dcgmExporter:
                enabled: true
              gfd:
                enabled: true
              migManager:
                enabled: true
              nodeStatusExporter:
                enabled: true
              vfioManager:
                enabled: true
              vgpuDeviceManager:
                enabled: true
              sandboxDevicePlugin:
                enabled: true
              ccManager:
                enabled: true
      services:
        monitoring:
          dsci:
            managementState: Managed

  - chart: external-secrets-operator
    targetRevision: 1.1.7
    namespace: external-secrets-operator
    values:
      platformMetadata:
        enabled: true
      secretStore:
        name: aws-secrets-manager
      target:
        enabled: false
      helper-status-checker:
        enabled: true

  - chart: maas-additional-config
    targetRevision: 0.1.0
    namespace: redhat-ods-applications
    values:
      image:
        tag: latest
      secretStore:
        name: aws-secrets-manager
      awsSecret:
        key: rhai/maas/postgres-creds
      userWorkloadMonitoring:
        enabled: true
      dashboardConfig:
        enabled: true

  - chart: maas-model
    name: maas-model-simulator
    targetRevision: 0.2.1
    namespace: llm

  - chart: maas-model
    name: maas-model-qwen25-3b
    targetRevision: 0.2.1
    namespace: llm
    values:
      createNamespace: false
      model:
        name: qwen25-3b
        displayName: "Qwen 2.5 3B Instruct (GPTQ-Int4)"
        description: "Quantized 3B instruction-tuned model on GPU"
        uri: "hf://Qwen/Qwen2.5-3B-Instruct-GPTQ-Int4"
        modelName: "qwen25-3b"
        replicas: 1
        gpu:
          enabled: true
          count: 1
        container:
          image: "registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:5800e12b2a465f15961fcf34b645d79ed4f91ec9161eab22b1205d12682183c8"
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - "--served-model-name=qwen25-3b"
            - --model=/mnt/models
            - --max-model-len=4096
            - --quantization=gptq_marlin
            - --enforce-eager
            - --enable-ssl-refresh
            - --ssl-certfile=/var/run/kserve/tls/tls.crt
            - --ssl-keyfile=/var/run/kserve/tls/tls.key
            - --enable-force-include-usage
          env:
            - name: HF_HOME
              value: /tmp/hf_home
            - name: HF_HUB_DISABLE_XET
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 8Gi
            limits:
              cpu: "2"
              memory: 12Gi
      subscription:
        free:
          enabled: true
          tokenLimit: 100
          tokenWindow: 1m
          priority: 10
        premium:
          enabled: true
          tokenLimit: 100000
          tokenWindow: 1m
          priority: 20

  - chart: maas-alerting-additional-config
    targetRevision: 0.1.0
    namespace: redhat-ods-monitoring

  - chart: maas-external-model
    name: maas-external-gemini
    targetRevision: 0.1.0
    namespace: external-models
    values:
      provider:
        name: gemini
        type: openai
        endpoint: generativelanguage.googleapis.com
        secret:
          name: gemini-api-key
      model:
        name: gemini-2-5-flash
        displayName: "Gemini 2.5 Flash"
        description: "Google Gemini 2.5 Flash via OpenAI-compatible API"
        targetModel: gemini-2.5-flash
        path: /v1beta/openai/chat/completions
      secretStore:
        enabled: true
      awsSecret:
        key: rhai/gemini/api-key

  - chart: maas-verify
    targetRevision: 0.1.3
    namespace: maas-verify
