teamName: cluster-config

defaults:
  clusterName: rhai
  finalizers: resources-finalizer.argocd.argoproj.io
  gitopsNamespace: openshift-gitops
  helmRepoUrl: https://rh-mobb.github.io/validated-pattern-helm-charts/
  path: charts
  plugin: false
  AWS_REGION: "ap-southeast-2"
  AVP_TYPE: "awssecretsmanager"

infrastructure:
  - chart: rhai-on-openshift-chart
    gitRepoUrl: https://github.com/opendatahub-io/odh-gitops.git
    targetRevision: main
    path: charts/rhai-on-openshift-chart
    namespace: redhat-ods-operator
    values:
      skipCrdCheck: true
      operator:
        type: rhoai
        enabled: true
      profile: rhaii
      components:
        dashboard:
          dsc:
            managementState: Managed
        workbenches:
          dsc:
            managementState: Managed
        aipipelines:
          dsc:
            managementState: Managed
        kserve:
          dsc:
            managementState: Managed
            nim:
              managementState: Managed
          gateway:
            spec:
              listeners:
                - name: https
                  port: 443
                  protocol: HTTPS
                  allowedRoutes:
                    namespaces:
                      from: Selector
        kueue:
          dsc:
            managementState: Unmanaged
        ray:
          dsc:
            managementState: Managed
        modelregistry:
          dsc:
            managementState: Managed
        trustyai:
          dsc:
            managementState: Managed
        trainingoperator:
          dsc:
            managementState: Managed
        trainer:
          dsc:
            managementState: Managed
        feastoperator:
          dsc:
            managementState: Managed
        aigateway:
          dsc:
            managementState: Managed
            modelsAsAService:
              managementState: Managed
          modelsAsAService:
            gateway:
              spec:
                listeners:
                  - name: https
                    port: 443
                    protocol: HTTPS
                    allowedRoutes:
                      namespaces:
                        from: Selector
        ogx:
          dsc:
            managementState: Managed
        mlflowoperator:
          dsc:
            managementState: Managed
      dependencies:
        rhcl:
          config:
            tlsEnabled: true
        nvidiaGPUOperator:
          config:
            spec:
              operator:
                defaultRuntime: crio
                use_ocp_driver_toolkit: true
              daemonsets:
                updateStrategy: RollingUpdate
                rollingUpdate:
                  maxUnavailable: "1"
              driver:
                enabled: true
              toolkit:
                enabled: true
              devicePlugin:
                enabled: true
              dcgm:
                enabled: true
              dcgmExporter:
                enabled: true
              gfd:
                enabled: true
              migManager:
                enabled: true
              nodeStatusExporter:
                enabled: true
              vfioManager:
                enabled: true
              vgpuDeviceManager:
                enabled: true
              sandboxDevicePlugin:
                enabled: true
              ccManager:
                enabled: true
      services:
        monitoring:
          dsci:
            managementState: Managed

  - chart: external-secrets-operator
    targetRevision: 1.1.7
    namespace: external-secrets-operator
    values:
      platformMetadata:
        enabled: true
      secretStore:
        name: aws-secrets-manager
      target:
        enabled: false
      helper-status-checker:
        enabled: true

  - chart: maas-postgres
    targetRevision: 0.1.0
    namespace: redhat-ods-applications
    values:
      secretStore:
        name: aws-secrets-manager
      awsSecret:
        key: rhai/maas/postgres-creds

  - chart: maas-model
    targetRevision: 0.1.0
    namespace: llm
